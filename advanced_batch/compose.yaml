services:
  api:
    build:
      context: .
      dockerfile: advanced_batch/Dockerfile
    environment:
      ADVANCED_DB_PATH: /data/events.sqlite3
    volumes:
      - events_demo:/data
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
  redpanda:
    image: redpandadata/redpanda:v24.3.5
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --overprovisioned
      - --node-id=0
      - --check=false
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
    ports:
      - "127.0.0.1:19092:19092"
    restart: unless-stopped
volumes:
  events_demo:
