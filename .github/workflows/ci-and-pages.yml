name: Portfolio quality gates and Pages
on:
  push:
    branches: [main, audit-quality-upgrade-2026-10-21]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
env:
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install analytical dependencies
        run: python -m pip install -r requirements-case-studies.txt
      - name: Unit, numerical guardrail and 111-script smoke tests
        run: python -m unittest discover -s tests -v
      - name: Verify generated data and report reproduce exactly
        run: |
          python case_studies/analytics.py > /dev/null
          python -m compileall -q projetos case_studies f1-predictive-intelligence
  deploy-pages:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
        id: deployment
