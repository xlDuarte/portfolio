name: Integrated portfolio - 111 projects quality gates and Pages
on:
  push:
    branches: [main, integration-111-projects-audit]
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
env:
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  TF_CPP_MIN_LOG_LEVEL: '2'
  CUDA_VISIBLE_DEVICES: '-1'
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - name: Front-end physics tests and reproducible bundle (site/assets/hero/hero.js)
        run: |
          npm ci
          npm test
          npm run build:hero
          git diff --exit-code -- site/assets/hero
      - name: Install OCR runtime
        run: sudo apt-get update -qq && sudo apt-get install -y tesseract-ocr
      - name: Install all core domain dependencies (heavy CNN/MLflow tested separately)
        run: python -m pip install --no-cache-dir -r requirements/integration.txt
      - name: Audit 111 canonical projects and integrated evidence
        run: |
          python scripts/audit_integrated_portfolio.py --check
          python -m unittest discover -s tests -p test_integration_111.py -v
          python -m unittest discover -s tests -p test_integrated_audit_report.py -v
      - name: Integration, unit and 111-entrypoint smoke tests
        run: python -m unittest discover -s tests -v
      - name: Compile all Python modules and regenerate analytics
        run: |
          python case_studies/analytics.py > /dev/null
          python -m compileall -q projetos case_studies analytics_eda regression_batch classification_batch nlp_batch recommendation_batch timeseries_batch vision_batch business_batch advanced_batch motorsport_batch f1-predictive-intelligence
      - name: Site build is reproducible (committed site/ matches scripts/build_site.py)
        run: |
          python -m pip install --no-cache-dir -r requirements/site.txt
          python scripts/build_site.py
          git diff --exit-code -- site vercel.json
      - name: Build the GitHub Pages mirror (redirects to the canonical Vercel site)
        run: |
          python scripts/prepare_pages.py --repo "${GITHUB_REPOSITORY}" --output _site
          test -s _site/index.html
          test -f _site/404.html
          test -f _site/robots.txt
          test -f _site/.nojekyll
          python -m unittest discover -s tests -p test_pages_release.py -v
  deploy-pages:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Build final GitHub Pages site with safe /portfolio/ links
        run: python scripts/prepare_pages.py --repo "${GITHUB_REPOSITORY}" --output _site
      - name: Detect whether GitHub Pages has been enabled
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=$(curl --silent --show-error --output /tmp/pages-site.json \
            --write-out '%{http_code}' \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages")
          if [ "$status" = "200" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "GitHub Pages exists; attempting deployment."
          elif [ "$status" = "404" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::GitHub Pages is not configured for this repository. Code quality checks passed; publishing is skipped. Enable Pages in Settings > Pages, select GitHub Actions, and rerun."
          else
            cat /tmp/pages-site.json
            echo "::error::Cannot check GitHub Pages configuration: HTTP $status"
            exit 1
          fi
      - uses: actions/configure-pages@v5
        if: steps.pages.outputs.enabled == 'true'
      - uses: actions/upload-pages-artifact@v5
        if: steps.pages.outputs.enabled == 'true'
        with:
          path: _site
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/deploy-pages@v4
        if: steps.pages.outputs.enabled == 'true'
        id: deployment
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
