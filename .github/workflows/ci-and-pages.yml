name: Integrated portfolio - 111 projects quality gates and Pages
on:
  push:
    branches: [main, integration-111-projects-audit]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
env:
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  TF_CPP_MIN_LOG_LEVEL: '2'
  CUDA_VISIBLE_DEVICES: '-1'
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install OCR runtime
        run: sudo apt-get update -qq && sudo apt-get install -y tesseract-ocr
      - name: Install all core domain dependencies (heavy CNN/MLflow tested separately)
        run: python -m pip install --no-cache-dir -r requirements-integration.txt
      - name: Audit 111 canonical projects and integrated evidence
        run: python -m unittest discover -s tests -p test_integration_111.py -v
      - name: Integration, unit and 111-entrypoint smoke tests
        run: python -m unittest discover -s tests -v
      - name: Compile all Python modules and regenerate analytics
        run: |
          python case_studies/analytics.py > /dev/null
          python -m compileall -q projetos case_studies analytics_eda regression_batch classification_batch nlp_batch recommendation_batch timeseries_batch vision_batch business_batch advanced_batch motorsport_batch f1-predictive-intelligence
  deploy-pages:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
        id: deployment
