name: Rebuild and validate historical F1 data
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  historical-data:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-real-f1.txt
      - run: python scripts/collect_f1_real.py
      - run: python scripts/fit_f1_strategy.py
      - run: python scripts/train_f1_real.py
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
      - run: node tests/real_f1_checks.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: historical-f1-validated
          path: site/motorsport/data/*.json
