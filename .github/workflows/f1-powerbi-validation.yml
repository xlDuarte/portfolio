name: Research F1 models and Power BI structural checks
on:
  push:
    branches: [main]
    paths:
      - 'f1-predictive-intelligence/ml/training/**'
      - 'powerbi-industrial/**'
      - 'tests/test_f1_trained_pipeline.py'
      - 'tests/test_powerbi_semantic_model.py'
      - 'requirements-f1-research.txt'
      - '.github/workflows/f1-powerbi-validation.yml'
  pull_request:
    paths:
      - 'f1-predictive-intelligence/ml/training/**'
      - 'powerbi-industrial/**'
      - 'tests/test_f1_trained_pipeline.py'
      - 'tests/test_powerbi_semantic_model.py'
      - 'requirements-f1-research.txt'
      - '.github/workflows/f1-powerbi-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research-models:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --no-cache-dir -r requirements-f1-research.txt
      - run: python -m unittest discover -s tests -p test_f1_trained_pipeline.py -v
      - run: python -m unittest discover -s tests -p test_powerbi_semantic_model.py -v
      - name: Execute full 8-model synthetic fixture
        run: python f1-predictive-intelligence/ml/training/trained_pipeline.py --synthetic-demo --output /tmp/f1-evaluation.json
      - name: Validate research result without treating as real F1 data
        run: |
          python - <<'PY'
          import json
          x=json.load(open('/tmp/f1-evaluation.json'))
          assert len(x['model_results']) == 8
          assert all(z['status']=='EVALUATED' for z in x['model_results'].values())
          assert abs(sum(r['win_prob'] for r in x['predictions'])-1)<1e-10
          assert abs(sum(r['podium_prob'] for r in x['predictions'])-3)<1e-10
          PY
