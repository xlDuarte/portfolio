name: Classification batch verification
on:
  push:
    paths: ['classification_batch/**', 'tests/test_classification_batch.py', 'requirements-classification.txt', '.github/workflows/classification-batch.yml']
  pull_request:
    paths: ['classification_batch/**', 'tests/test_classification_batch.py', 'requirements-classification.txt', '.github/workflows/classification-batch.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements-classification.txt
      - run: python -m unittest discover -s tests -p test_classification_batch.py -v
