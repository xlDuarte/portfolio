name: Preview release and GHCR demo packages
on:
  workflow_run:
    workflows: ["Integrated portfolio - 111 projects quality gates and Pages"]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: "SemVer tag to create, e.g. v0.1.0-preview.1"
        required: true
        default: "v0.1.0-preview.1"
        type: string
permissions:
  contents: read
concurrency:
  group: portfolio-preview-release
  cancel-in-progress: false

jobs:
  release:
    if: >-
      (github.event_name == 'workflow_dispatch') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      created: ${{ steps.create.outputs.created }}
      publish_packages: ${{ steps.create.outputs.publish_packages }}
      release_tag: ${{ steps.create.outputs.release_tag }}
      release_sha: ${{ steps.create.outputs.release_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Tag must point at the current validated main head
        id: head
        env:
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
          EVENT_KIND: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          if [ "${EVENT_KIND}" = "workflow_run" ] && [ "${EXPECTED_SHA}" != "${sha}" ]; then
            echo "::warning::A newer main commit exists; skip release of an outdated CI commit."
            echo "current=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tag="${INPUT_TAG:-v0.1.0-preview.1}"
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]; then
            echo "::error::Version must be a SemVer-like tag prefixed v."
            exit 1
          fi
          echo "current=true" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Build static release site and archive
        if: steps.head.outputs.current == 'true'
        run: |
          python scripts/prepare_pages.py --repo "${GITHUB_REPOSITORY}" --output _site
          cd _site && zip -qr ../portfolio-pages-preview.zip . && cd ..
          test -s portfolio-pages-preview.zip
      - name: Create truthful prerelease (idempotent)
        id: create
        if: steps.head.outputs.current == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.head.outputs.tag }}
          RELEASE_SHA: ${{ steps.head.outputs.sha }}
        run: |
          set -euo pipefail
          echo "release_sha=${RELEASE_SHA}" >> "$GITHUB_OUTPUT"
          echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::notice::Release $RELEASE_TAG exists. Will not retarget its tag."
            echo "created=false" >> "$GITHUB_OUTPUT"
            existing_commit="$(git rev-list -n 1 "$RELEASE_TAG" 2>/dev/null || true)"
            if [ "$existing_commit" = "$RELEASE_SHA" ]; then
              echo "publish_packages=true" >> "$GITHUB_OUTPUT"
            else
              echo "publish_packages=false" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi
          if [ "$RELEASE_TAG" = "v0.1.0-preview.1" ]; then
            notes_args=(--notes-file docs/releases/v0.1.0-preview.1.md)
          else
            notes_args=(--generate-notes)
          fi
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$RELEASE_SHA" \
            --title "Automotive & Industrial Lab $RELEASE_TAG" \
            --prerelease \
            "${notes_args[@]}" \
            portfolio-pages-preview.zip TECHNOLOGY_GAP_MATRIX_INTEGRATED.csv
          echo "created=true" >> "$GITHUB_OUTPUT"
          echo "publish_packages=true" >> "$GITHUB_OUTPUT"

  ghcr-demo-packages:
    needs: release
    if: needs.release.outputs.publish_packages == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: industrial-analytics-api-demo
            dockerfile: advanced_batch/Dockerfile
          - name: motorsport-mlops-api-demo
            dockerfile: motorsport_batch/Dockerfile
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.release_sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/xlduarte/${{ matrix.name }}
          tags: |
            type=raw,value=${{ needs.release.outputs.release_tag }}
          labels: |
            org.opencontainers.image.title=${{ matrix.name }}
            org.opencontainers.image.description=Synthetic educational industrial analytics API, not for production
            org.opencontainers.image.source=https://github.com/xlDuarte/portfolio
            org.opencontainers.image.licenses=NOASSERTION
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
