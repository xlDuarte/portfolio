version: 2
updates:
  - package-ecosystem: pip
    directories: ["/", "/requirements"]
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
  - package-ecosystem: docker
    directory: "/advanced_batch"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
  - package-ecosystem: docker
    directory: "/motorsport_batch"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
