<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Arquivo da direção de prova · Gabriel Duarte</title><link rel="stylesheet" href="../../../motorsport/strategy/strategy.css"><style>main{max-width:1200px;margin:auto;padding:40px 24px}table{width:100%;border-collapse:collapse}td,th{padding:12px;border-bottom:1px solid #ddd;text-align:left}code,pre{white-space:pre-wrap;overflow-wrap:anywhere}select,input,button{max-width:100%;padding:10px;margin:12px 0}#demo{min-height:260px}</style></head><body><main><a href="../../../motorsport/racing/">← Projetos</a><p class="eyebrow">MOTORSPORT / 107 / EVIDÊNCIAS</p><h1>Arquivo da direção de prova</h1><section id="demo" data-lab="107"><h2>GP do Bahrein · 2024</h2><p>Mensagens históricas da direção de prova via OpenF1, sessão 9472. Pesquise no texto original em inglês.</p><label>Pesquisar <input id="query" type="search" placeholder="Ex.: DRS"></label><p id="count" role="status"></p><ol id="messages"></ol></section><p><a href="../../../f1-models/">Consultar modelos com dados reais da F1 ↗</a></p></main><script type="module">
import {loadRace, fail} from '../../../motorsport/data/load.mjs';
try {
  const race = await loadRace();
  const messages = race.race_control;
  if (!Array.isArray(messages) || !messages.length) throw Error('Arquivo indisponível');
  const query = document.querySelector('#query');
  function render() {
    const matches = messages.filter(row => row.message?.toLowerCase().includes(query.value.trim().toLowerCase()));
    document.querySelector('#count').textContent = matches.length + ' mensagens';
    document.querySelector('#messages').replaceChildren(...matches.map(row => {
      const item = document.createElement('li');
      item.textContent = row.date + ' · ' + row.message;
      return item;
    }));
  }
  query.addEventListener('input', render);
  render();
} catch (error) { fail(error); }
</script></body></html>
